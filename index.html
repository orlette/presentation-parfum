<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection Musc — Maison de Parfum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* ============ BASE & THEME SOMBRE ============ */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#0a090d;
  color:#f4efe6;
  font-family:'Jost',system-ui,sans-serif;
  overflow:hidden; /* Empêche le scroll */
  -webkit-font-smoothing:antialiased;
}

/* ============ SCENE ============ */
.scene{
  position:relative;
  height:100vh;
  height:100dvh;
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  justify-items:center;
  padding:0 clamp(20px,5vw,80px);
  overflow:hidden;
  isolation:isolate;
  
  /* Animations diagonales */
  --px:-18vw;
  --ix:18vw;
}

/* Alternance des côtés */
.scene.flip{ --px:18vw; --ix:-18vw; }
.scene.flip .perfume-side{ order:2; }
.scene.flip .ingredients-side{ order:1; }

/* ============ EN-TÊTE (TITRE) ============ */
.nouveau {
  position: absolute;
  top: clamp(20px, 4vh, 40px);
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 clamp(20px, 5vw, 80px); /* Même padding que la scène */
  z-index: 10;
  pointer-events: none; /* Ne bloque pas les clics */
}

.nouveau h4 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(20px, 2.5vh, 28px);
  font-weight: 400;
  letter-spacing: 0.05em;
  color: #f4efe6;
  margin: 0;
}

.nouveau h5 {
  font-family: 'Jost', sans-serif;
  font-size: clamp(9px, 1.2vh, 11px);
  font-weight: 400;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #c9a86a; /* Touche dorée */
  margin: 0;
}

/* Halo de fond coloré */
.glow{
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  z-index:-1;
  pointer-events:none;
  transition:background 1.2s ease;
  opacity: 0.6;
}
.glow-a{ width:60vmax; height:60vmax; left:-15vmax; top:-15vmax; }
.glow-b{ width:50vmax; height:50vmax; right:-15vmax; bottom:-20vmax; }

/* ============ COTE PARFUM ============ */
.perfume-side{
  order:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width: 100%;
  transition: transform 1s cubic-bezier(.16,1,.3,1), opacity .5s ease;
  will-change:transform,opacity;
}

.scene:not(.in) .perfume-side{
  opacity:0;
  transform:translate(var(--px), 20vh) rotate(-10deg) scale(.85);
}

.img-wrap{
  position: relative;
  height: clamp(280px, 50vh, 550px); /* Ajusté pour laisser de la place au titre */
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  animation: float 6s ease-in-out infinite;
}

.img-wrap img {
  max-height: 100%;
  max-width: 100%;
  object-fit: contain;
  filter: drop-shadow(0 30px 50px rgba(0,0,0,0.9));
}

@keyframes float{
  0%,100%{ transform:translateY(0); }
  50%    { transform:translateY(-15px); }
}

.p-info {
  text-align: center;
  margin-top: clamp(10px, 3vh, 30px);
}
.p-name{
  font-family:'Cormorant Garamond',serif;
  font-weight:400;
  font-size:clamp(28px,4vh,48px);
  line-height:1;
  margin:0;
  color: #f4efe6;
}
.p-family{
  font-size:clamp(9px,1.2vh,12px);
  letter-spacing:.4em;
  text-transform:uppercase;
  color:#c9a86a;
  margin-top:1em;
}

/* ============ COTE INGREDIENTS ============ */
.ingredients-side{
  order:2;
  display:flex;
  flex-direction:column;
  gap:clamp(20px, 4vh, 40px);
  transition: transform 1s cubic-bezier(.16,1,.3,1), opacity .5s ease;
  will-change:transform,opacity;
  width: 100%;
  max-width: 320px;
}

.scene:not(.in) .ingredients-side{
  opacity:0;
  transform:translate(var(--ix), -15vh);
}

.ing{
  display:flex;
  align-items:center;
  gap: clamp(15px, 2vw, 25px);
  opacity:0;
  transform:translateY(-20px);
  transition: opacity .6s ease, transform .8s cubic-bezier(.16,1,.3,1);
}

.scene.in .ing{
  opacity:1;
  transform:translateY(0);
  transition-delay:calc(250ms + var(--i) * 150ms);
}

.ing-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(24px, 3.5vh, 36px);
  color: #c9a86a;
  font-style: italic;
  min-width: 40px;
}

.ing-line {
  height: 1px;
  background: rgba(255, 255, 255, 0.15);
  flex-grow: 1;
  position: relative;
}
.ing-line::after {
  content: '';
  position: absolute;
  right: 0; top: -2px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}

.ing-details {
  display: flex;
  flex-direction: column;
  min-width: 110px;
}

.ing-name{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(18px, 2.5vh, 26px);
  color: #f4efe6;
  line-height: 1.1;
}
.ing-role{
  font-size:9px;
  letter-spacing:.35em;
  text-transform:uppercase;
  color:rgba(244, 239, 230, 0.5);
  margin-top: 4px;
}

/* ============ HUD / NAVIGATION ============ */
.hud{
  position:absolute;
  left:0; right:0;
  bottom:clamp(15px,3vh,35px);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
  z-index:10;
}
.dots{ display:flex; gap:12px; }
.dot{
  width:32px; height:2px;
  padding:0; border:0;
  background:rgba(255,255,255,0.2);
  cursor:pointer;
  overflow:hidden;
  position: relative;
  transition:background .3s ease;
}
.dot:hover{ background:rgba(255,255,255,0.5); }
.dot .fill{
  position: absolute;
  top:0; left:0;
  height:100%; width:100%;
  background:#c9a86a;
  transform:scaleX(0);
  transform-origin:left center;
}
@keyframes fillBar{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }

.counter{
  font-size:10px;
  letter-spacing:.4em;
  color:rgba(244, 239, 230, 0.5);
}
.counter #curNum{ color:#f4efe6; font-weight: 500; }

/* ============ RESPONSIVE ============ */
@media (max-width: 860px){
  .nouveau {
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    padding-top: 20px;
  }
  
  .scene{
    grid-template-columns: 1fr;
    align-content: center;
    gap: 20px;
    padding: 80px 20px 100px; /* Plus de padding en haut pour le titre */
    --px: -15vw;
    --ix: 15vw;
  }
  .scene.flip{ --px: 15vw; --ix: -15vw; }

  .img-wrap { height: clamp(200px, 35vh, 300px); }
  
  .ingredients-side {
    flex-direction: row;
    justify-content: center;
    max-width: 100%;
    gap: 15px;
  }
  .ing {
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    text-align: left;
    flex: 1;
  }
  .ing-line { width: 100%; margin: 5px 0; }
  .ing-line::after { right: auto; left: 0; }
  .ing-num { font-size: 20px; min-width: auto; }
  .ing-name { font-size: 16px; }
  .ing-role { font-size: 8px; letter-spacing: .2em; }
}

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001s !important; transition-duration:.2s !important; }
}
</style>
</head>
<body>

<div class="scene" id="scene">

  <!-- TITRE AJOUTÉ ICI (à l'intérieur de la scène) -->
  <div class="nouveau">
    <h4>Maison Lumière</h4>
    <h5>Collection privée Musc</h5>
  </div>

  <div class="glow glow-a" id="glowA"></div>
  <div class="glow glow-b" id="glowB"></div>

  <!-- FLACON / IMAGE -->
  <div class="perfume-side">
    <div class="img-wrap" id="imgWrap">
      <img id="perfumeImg" src="" alt="Flacon de parfum">
    </div>
    <div class="p-info">
      <h2 class="p-name" id="pName"></h2>
      <p class="p-family" id="pFamily"></p>
    </div>
  </div>

  <!-- INGREDIENTS -->
  <div class="ingredients-side" id="ingredientsSide"></div>

  <!-- HUD -->
  <div class="hud">
    <div class="dots" id="dots"></div>
    <div class="counter"><span id="curNum">01</span> / 07</div>
  </div>

</div>

<script>
/* ===================== DONNEES ===================== */
const perfumes = [
  {
    id:1,
    name:"Musc Molinard",
    family:"Ambré Floral",
    img:"images/parfum1.png", 
    accent:"#9d5ce6",
    notes:[
      { n:"Orchidée", r:"Tête" },
      { n:"Musc", r:"Cœur" },
      { n:"Ambre", r:"Fond" }
    ]
  },
  {
    id:2,
    name:"Perle d'Orient",
    family:"Musc Frais",
    img:"images/parfum2.png", 
    accent:"#e6b85c",
    notes:[
      { n:"Vanille", r:"Tête" },
      { n:"Musc Blanc", r:"Cœur" },
      { n:"Bois de Santal", r:"Fond" }
    ]
  },
  {
    id:3,
    name:"Musc Outreblanc",
    family:"Floral Poudré",
    img:"images/parfum3.png", 
    accent:"#d6d1c4",
    notes:[
      { n:"Fleur de Tiaré", r:"Tête" },
      { n:"Musc Végétal", r:"Cœur" },
      { n:"Minéral", r:"Fond" }
    ]
  },
  {
    id:4,
    name:"Old Money",
    family:"Agrumes & Musc",
    img:"images/parfum4.png", 
    accent:"#f2d16b",
    notes:[
      { n:"Citron", r:"Tête" },
      { n:"Musc Doré", r:"Cœur" },
      { n:"Cèdre", r:"Fond" }
    ]
  },
  {
    id:5,
    name:"Musc Bella",
    family:"Oriental Fruité",
    img:"images/parfum5.png", 
    accent:"#7a5ce6",
    notes:[
      { n:"Cassis", r:"Tête" },
      { n:"Iris", r:"Cœur" },
      { n:"Vanille Noire", r:"Fond" }
    ]
  },
  {
    id:6,
    name:"Musc Noir Rose",
    family:"Floral Charnel",
    img:"images/parfum6.png", 
    accent:"#e65c7a",
    notes:[
      { n:"Rose de Damas", r:"Tête" },
      { n:"Musc Noir", r:"Cœur" },
      { n:"Praline", r:"Fond" }
    ]
  },
  {
    id:7,
    name:"Ajmal Gold",
    family:"Oriental Boisé",
    img:"images/parfum7.png", 
    accent:"#e6a85c",
    notes:[
      { n:"Oud", r:"Tête" },
      { n:"Musc", r:"Cœur" },
      { n:"Ambre", r:"Fond" }
    ]
  }
];

/* ===================== REFS ===================== */
const scene           = document.getElementById('scene');
const perfumeImg      = document.getElementById('perfumeImg');
const ingredientsSide = document.getElementById('ingredientsSide');
const glowA           = document.getElementById('glowA');
const glowB           = document.getElementById('glowB');
const dotsEl          = document.getElementById('dots');
const curNum          = document.getElementById('curNum');
const pName           = document.getElementById('pName');
const pFamily         = document.getElementById('pFamily');

const DUR = 6000; 
let current = -1;
let timer   = null;
let token   = 0;

/* ===================== CONSTRUCTION ===================== */
function build(p){
  perfumeImg.src = p.img;
  perfumeImg.alt = p.name;
  
  pName.textContent    = p.name;
  pFamily.textContent  = p.family;

  ingredientsSide.innerHTML = p.notes.map((n, k) => `
    <div class="ing" style="--i:${k}">
      <div class="ing-num">0${k+1}</div>
      <div class="ing-line"></div>
      <div class="ing-details">
        <span class="ing-name">${n.n}</span>
        <span class="ing-role">${n.r}</span>
      </div>
    </div>
  `).join('');
}

function applyAccent(p){
  document.documentElement.style.setProperty('--accent', p.accent);
  glowA.style.background = `radial-gradient(circle, ${p.accent}55 0%, transparent 60%)`;
  glowB.style.background = `radial-gradient(circle, ${p.accent}33 0%, transparent 60%)`;
}

/* ===================== NAVIGATION ===================== */
function buildDots(){
  dotsEl.innerHTML = perfumes.map((p, i) =>
    `<button class="dot" data-i="${i}" aria-label="${p.name}"><span class="fill"></span></button>`
  ).join('');
  dotsEl.querySelectorAll('.dot').forEach(d => {
    d.addEventListener('click', () => go(+d.dataset.i));
  });
}

function markDot(i){
  [...dotsEl.children].forEach((d, k) => {
    const f = d.querySelector('.fill');
    d.classList.toggle('active', k === i);
    f.style.animation = 'none';
    f.style.transform = 'scaleX(0)';
    if (k === i){
      void f.offsetWidth; 
      f.style.animation = `fillBar ${DUR}ms linear forwards`;
    }
  });
}

function go(i, first){
  if (i === current) return;
  current = i;

  const my = ++token;
  clearTimeout(timer);

  scene.classList.remove('in');

  setTimeout(() => {
    if (my !== token) return;

    const p = perfumes[i];

    scene.classList.toggle('flip', i % 2 === 1); 

    build(p);
    applyAccent(p);
    markDot(i);

    const num = String(i + 1).padStart(2, '0');
    curNum.textContent = num;

    requestAnimationFrame(() => requestAnimationFrame(() => {
      scene.classList.add('in'); 
    }));

    timer = setTimeout(() => go((i + 1) % perfumes.length), DUR);

  }, first ? 100 : 450);
}

/* ===================== INIT ===================== */
buildDots();
go(0, true);

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go((current + 1) % perfumes.length);
  if (e.key === 'ArrowLeft')  go((current - 1 + perfumes.length) % perfumes.length);
});
</script>
</body>
</html>
